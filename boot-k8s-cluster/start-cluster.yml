apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: deploy-do-kube-cluster-
  namespace: argo
  annotations:
    workflows.argoproj.io/title: "**Bootstrap and Provision Kubernetes Cluster**"
    workflows.argoproj.io/description: |
      With this workflow you create a Kubernetes Cluster in Digital Ocean
      and provision it with the following kube tools:
        * external secrets operator
        * external-dns
        * cert-manager
        * traefik
spec:
  entrypoint: deploy-do-kube-cluster
  onExit: exit-handler
  volumes:
    - name: doks-kubeconfig
      secret:
        secretName: doks-kubeconfig
        optional: true
  volumeClaimTemplates:
    - metadata:
        name: terraform-provider-cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
        storageClassName: standard
    - metadata:
        name: workflow-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Mi
        storageClassName: standard
  arguments:
    parameters:
      - name: debug
        value: "false"
        enum:
          - "true"
          - "false"
      - name: environment
        value: dev
      # TEMPORARY: 120s so the reuse/expiry behavior of rotate-doks-kubeconfig
      # can be tested quickly. Switch to "1296000" (15 days) once validated.
      - name: kubeconfig_expiry_seconds
        value: "120"
      - name: terragrunt_branch
        value: main
      - name: terragrunt_commit
        value: latest
      - name: terraform_branch
        value: main
      - name: terraform_commit
        value: latest
      - name: tg_no_color
        value: "true"
        enum:
          - "true"
          - "false"
      - name: tg_log_level
        value: INFO
        enum:
          - ERROR
          - WARN
          - INFO
          - DEBUG
          - TRACE
      - name: kubeconfig_path
        value: /.kube/doks.config
  templates:
    - name: deploy-do-kube-cluster
      dag:
        tasks:
          - name: download-terraform-provider-cache
            templateRef:
              name: run-terragrunt
              template: download-terraform-provider-cache

          - name: check-changes-k8s-configuration
            depends: download-terraform-provider-cache.Succeeded
            templateRef:
              name: run-terragrunt
              template: run-terragrunt
            arguments:
              parameters:
                - name: action
                  value: plan
                - name: workingDir
                  value: "{{workflow.parameters.environment}}/k8s-cluster"
                - name: terraform_source_module_path
                  value: k8s-cluster
                - name: extra_args
                  value: "-detailed-exitcode"

          - name: apply-changes-k8s-configuration
            depends: check-changes-k8s-configuration.Succeeded
            when: "{{tasks.check-changes-k8s-configuration.outputs.parameters.terragrunt_exit_code}} == 2"
            templateRef:
              name: run-terragrunt
              template: run-terragrunt
            arguments:
              parameters:
                - name: action
                  value: apply
                - name: workingDir
                  value: "{{workflow.parameters.environment}}/k8s-cluster"
                - name: terraform_source_module_path
                  value: k8s-cluster
                - name: extra_args
                  value: "--auto-approve"

          # - name: check-k8s-cluster-status-and-get-kubeconfig
          #   depends: check-changes-k8s-configuration.Succeeded
          #   template: check-k8s-cluster-status-and-get-kubeconfig

          - name: check-k8s-cluster-status-and-get-kubeconfig
            depends: check-changes-k8s-configuration.Succeeded
            templateRef:
              name: rotate-doks-kubeconfig
              template: rotate
            arguments:
              parameters:
                - name: cluster_name
                  value: dev-leonomano-projects
                - name: kubeconfig_path
                  value: "{{workflow.parameters.kubeconfig_path}}"

          - name: debug-kubeconfig
            depends: check-k8s-cluster-status-and-get-kubeconfig.Succeeded
            when: "{{workflow.parameters.debug}} == true"
            template: debug-kubeconfig

          - name: check-changes-external-secrets-configuration
            depends: >
              check-k8s-cluster-status-and-get-kubeconfig.Succeeded &&
              (apply-changes-k8s-configuration.Succeeded || apply-changes-k8s-configuration.Skipped) &&
              (debug-kubeconfig.Succeeded || debug-kubeconfig.Skipped)
            templateRef:
              name: run-terragrunt
              template: run-terragrunt
            arguments:
              parameters:
                - name: action
                  value: plan
                - name: workingDir
                  value: "{{workflow.parameters.environment}}/cluster-configuration/external-secrets-operator"
                - name: terraform_source_module_path
                  value: cluster-configuration/external-secrets-operator
                - name: extra_args
                  value: |
                    -detailed-exitcode \
                    --feature="state_path_prefix=do-k8s" \
                    --feature="kube_ctx={{tasks.check-k8s-cluster-status-and-get-kubeconfig.outputs.parameters.kube_ctx}}" \
                    --feature="kube_config_path={{workflow.parameters.kubeconfig_path}}"

          - name: apply-changes-external-secrets-configuration
            depends: check-changes-external-secrets-configuration.Succeeded
            when: "{{tasks.check-changes-external-secrets-configuration.outputs.parameters.terragrunt_exit_code}} == 2"
            templateRef:
              name: run-terragrunt
              template: run-terragrunt
            arguments:
              parameters:
                - name: action
                  value: apply
                - name: workingDir
                  value: "{{workflow.parameters.environment}}/cluster-configuration/external-secrets-operator"
                - name: terraform_source_module_path
                  value: cluster-configuration/external-secrets-operator
                - name: extra_args
                  value: |
                    --auto-approve \
                    --feature="state_path_prefix=do-k8s" \
                    --feature="kube_ctx={{tasks.check-k8s-cluster-status-and-get-kubeconfig.outputs.parameters.kube_ctx}}" \
                    --feature="kube_config_path={{workflow.parameters.kubeconfig_path}}"

          # cert-manager depends on ESO's ClusterSecretStore + CRDs already existing
          # (its ExternalSecret for the Cloudflare token references them).
          - name: check-changes-cert-manager-configuration
            depends: >
              apply-changes-external-secrets-configuration.Succeeded ||
              apply-changes-external-secrets-configuration.Skipped
            templateRef:
              name: run-terragrunt
              template: run-terragrunt
            arguments:
              parameters:
                - name: action
                  value: plan
                - name: workingDir
                  value: "{{workflow.parameters.environment}}/cluster-configuration/cert-manager"
                - name: terraform_source_module_path
                  value: cluster-configuration/cert-manager
                - name: extra_args
                  value: |
                    -detailed-exitcode \
                    --feature="state_path_prefix=do-k8s" \
                    --feature="kube_ctx={{tasks.check-k8s-cluster-status-and-get-kubeconfig.outputs.parameters.kube_ctx}}" \
                    --feature="kube_config_path={{workflow.parameters.kubeconfig_path}}"

          - name: apply-changes-cert-manager-configuration
            depends: check-changes-cert-manager-configuration.Succeeded
            when: "{{tasks.check-changes-cert-manager-configuration.outputs.parameters.terragrunt_exit_code}} == 2"
            templateRef:
              name: run-terragrunt
              template: run-terragrunt
            arguments:
              parameters:
                - name: action
                  value: apply
                - name: workingDir
                  value: "{{workflow.parameters.environment}}/cluster-configuration/cert-manager"
                - name: terraform_source_module_path
                  value: cluster-configuration/cert-manager
                - name: extra_args
                  value: |
                    --auto-approve \
                    --feature="state_path_prefix=do-k8s" \
                    --feature="kube_ctx={{tasks.check-k8s-cluster-status-and-get-kubeconfig.outputs.parameters.kube_ctx}}" \
                    --feature="kube_config_path={{workflow.parameters.kubeconfig_path}}"

          # Traefik depends on cert-manager's "letsencrypt-staging" ClusterIssuer
          # already existing (its Certificate resource references it by name).
          - name: check-changes-traefik-configuration
            depends: >
              apply-changes-cert-manager-configuration.Succeeded ||
              apply-changes-cert-manager-configuration.Skipped
            templateRef:
              name: run-terragrunt
              template: run-terragrunt
            arguments:
              parameters:
                - name: action
                  value: plan
                - name: workingDir
                  value: "{{workflow.parameters.environment}}/cluster-configuration/traefik"
                - name: terraform_source_module_path
                  value: cluster-configuration/traefik
                - name: extra_args
                  value: |
                    -detailed-exitcode \
                    --feature="state_path_prefix=do-k8s" \
                    --feature="kube_ctx={{tasks.check-k8s-cluster-status-and-get-kubeconfig.outputs.parameters.kube_ctx}}" \
                    --feature="kube_config_path={{workflow.parameters.kubeconfig_path}}"

          - name: apply-changes-traefik-configuration
            depends: check-changes-traefik-configuration.Succeeded
            when: "{{tasks.check-changes-traefik-configuration.outputs.parameters.terragrunt_exit_code}} == 2"
            templateRef:
              name: run-terragrunt
              template: run-terragrunt
            arguments:
              parameters:
                - name: action
                  value: apply
                - name: workingDir
                  value: "{{workflow.parameters.environment}}/cluster-configuration/traefik"
                - name: terraform_source_module_path
                  value: cluster-configuration/traefik
                - name: extra_args
                  value: |
                    --auto-approve \
                    --feature="state_path_prefix=do-k8s" \
                    --feature="kube_ctx={{tasks.check-k8s-cluster-status-and-get-kubeconfig.outputs.parameters.kube_ctx}}" \
                    --feature="kube_config_path={{workflow.parameters.kubeconfig_path}}"

    - name: debug-kubeconfig
      script:
        image: bitnami/kubectl:latest
        volumeMounts:
          - name: workflow-data
            mountPath: /.kube
            readOnly: true
        env:
          - name: KUBECONFIG
            value: "{{workflow.parameters.kubeconfig_path}}"
        command: [bash, -c]
        source: |
          set -e
          echo "KUBECONFIG=$KUBECONFIG"
          [[ -f "$KUBECONFIG" ]] && cat "$KUBECONFIG" || echo "$KUBECONFIG does not exist"
          kubectl get nodes

